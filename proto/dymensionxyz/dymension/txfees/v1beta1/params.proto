syntax = "proto3";

package dymensionxyz.dymension.txfees.v1beta1;

import "gogoproto/gogo.proto";

option go_package = "github.com/osmosis-labs/osmosis/v15/x/txfees/types";

// Params holds parameters for the txfees module
message Params {
    // epoch_identifier is what epoch type swap and burn will be triggered by
    // (day, week, etc.)
    string epoch_identifier = 1
        [ (gogoproto.moretags) = "yaml:\"epoch_identifier\"" ];
    
    // fee_exclude_list is a list of msgTypes that are excluded from validating fees
    repeated string fee_exclude_list = 2 [(gogoproto.moretags) = "yaml:\"fee_exclude_list\""];
  }
  